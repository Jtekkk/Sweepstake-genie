settings:
  headless: true           # run browser without GUI
  delay_between_entries: 3 # seconds between sweepstake entries
  max_entries_per_run: 50  # cap per session
  skip_captcha: true       # skip forms with captcha, log them instead
  log_file: "entries.log"
  database: "sweepstakes.db"
  captcha_service: "none"  # options: none, 2captcha, capsolver
  captcha_api_key: ""      # your API key from the service above
  manual_captcha: false    # solve CAPTCHAs yourself in a visible browser window
  manual_captcha_timeout: 180  # seconds to wait for you to solve each CAPTCHA
